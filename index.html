<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>まんがメモ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* Layout: title band -> "add" card (link + button on one row, details folded) -> "list" section (4 status tabs, search, cards with cover on the left). */
:root {
  --bg: #F6F8FF;
  --surface: #FFFFFF;
  --ink: #1B2140;
  --muted: #5F6785;
  --line: #DCE3F7;
  --accent: #3366FF;
  --accent-soft: #E6EDFF;
  --accent-ink: #FFFFFF;
  --done: #0F9D63;
  --done-soft: #DDF6EA;
  --hold: #C97800;
  --hold-soft: #FFF0D6;
  --danger: #D8344A;
  --band: #DCE8FF;
  --dots: rgba(51, 102, 255, 0.20);
  --font-body: "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", "Yu Gothic", system-ui, sans-serif;
  --font-display: "Dela Gothic One", "Zen Kaku Gothic New", "Hiragino Kaku Gothic ProN", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12162B; --surface: #1B2040; --ink: #F0F2FF; --muted: #A3AACB; --line: #2E3560;
    --accent: #7C9BFF; --accent-soft: #26305F; --accent-ink: #0F1430;
    --done: #4FD6A0; --done-soft: #1B3B33; --hold: #FFB347; --hold-soft: #3F3220; --danger: #FF8091;
    --band: #1A2147; --dots: rgba(124, 155, 255, 0.22); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12162B; --surface: #1B2040; --ink: #F0F2FF; --muted: #A3AACB; --line: #2E3560;
  --accent: #7C9BFF; --accent-soft: #26305F; --accent-ink: #0F1430;
  --done: #4FD6A0; --done-soft: #1B3B33; --hold: #FFB347; --hold-soft: #3F3220; --danger: #FF8091;
  --band: #1A2147; --dots: rgba(124, 155, 255, 0.22); color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 56px;
}
.wrap { max-width: 640px; margin: 0 auto; display: flex; flex-direction: column; gap: 28px; padding-top: 22px; }
header {
  margin-inline: calc(-1 * max(16px, env(safe-area-inset-left, 0px)));
  padding: 26px max(16px, env(safe-area-inset-left, 0px)) 22px;
  background-color: var(--band);
  background-image: radial-gradient(var(--dots) 1.4px, transparent 1.6px);
  background-size: 10px 10px;
}
header .in { max-width: 640px; margin: 0 auto; display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
h1 { font-family: var(--font-display); font-weight: 400; font-size: 30px; line-height: 1.15; margin: 0; text-wrap: balance; }
.sub { margin: 4px 0 0; color: var(--muted); font-size: 13px; }
.count { background: var(--surface); border-radius: 999px; padding: 4px 16px; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.count b { font-size: 22px; color: var(--accent); font-weight: 700; margin-right: 2px; }

h2 { margin: 0 0 10px; font-size: 17px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
h2 .mk { width: 26px; height: 26px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: inline-grid; place-items: center; font-size: 15px; line-height: 1; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; display: grid; gap: 12px; }
label, summary { font-size: 13px; font-weight: 700; color: var(--muted); }
.field { display: grid; gap: 4px; min-width: 0; }
input[type="text"] {
  width: 100%; font: inherit; color: var(--ink); background: var(--bg);
  border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 46px;
}
input[type="text"]::placeholder { color: var(--muted); opacity: .75; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button { font: inherit; cursor: pointer; }
.urlrow { display: grid; grid-template-columns: 1fr auto; gap: 8px; }
.primary { background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 10px; min-height: 46px; font-weight: 700; padding: 0 20px; }
.primary:disabled { opacity: .5; cursor: default; }
details > summary { cursor: pointer; min-height: 36px; display: flex; align-items: center; }
details[open] > summary { margin-bottom: 8px; }
.more { display: grid; grid-template-columns: 96px 1fr; gap: 12px; align-items: start; }
.fields { display: grid; gap: 10px; min-width: 0; }
@media (max-width: 420px) { .more { grid-template-columns: 80px 1fr; } }
.msg { min-height: 1.4em; margin: 0; font-size: 13px; color: var(--muted); }
.msg.err { color: var(--danger); }

.cover { width: 100%; aspect-ratio: 3 / 4; border-radius: 8px; border: 1px solid var(--line); background: var(--accent-soft); padding: 0; overflow: hidden; display: grid; place-items: center; color: var(--accent); font-size: 11px; font-weight: 700; line-height: 1.3; text-align: center; }
.cover.empty-c { border-style: dashed; border-color: var(--accent); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .plus { display: block; font-size: 22px; line-height: 1; margin-bottom: 2px; }

.listhead { display: flex; align-items: center; justify-content: space-between; gap: 8px; flex-wrap: wrap; }
.listhead h2 { margin: 0; }
.pick { background: var(--accent-soft); color: var(--accent); border: 0; border-radius: 999px; padding: 4px 16px; min-height: 38px; font-size: 14px; font-weight: 700; }
.tabs { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 12px 0 10px; }
.tab { background: var(--surface); color: var(--ink); border: 1px solid var(--line); border-radius: 12px; padding: 6px 4px; min-height: 52px; display: grid; justify-items: center; line-height: 1.25; font-size: 13px; }
.tab b { font-size: 18px; font-variant-numeric: tabular-nums; }
.tab[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }

ul.list { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 12px; }
.item { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px; display: grid; grid-template-columns: 80px 1fr; gap: 6px 12px; min-width: 0; }
.item.hl { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.body { min-width: 0; display: grid; gap: 3px; align-content: start; }
.top { display: flex; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); flex-wrap: wrap; }
.src { font-weight: 700; color: var(--ink); background: var(--bg); border-radius: 4px; padding: 0 6px; }
.pill { font-weight: 700; border-radius: 999px; padding: 0 10px; font-size: 12px; }
.pill.want { background: var(--accent-soft); color: var(--accent); }
.pill.done { background: var(--done-soft); color: var(--done); }
.pill.hold { background: var(--hold-soft); color: var(--hold); }
.ttl { font-weight: 700; font-size: 16px; line-height: 1.45; color: var(--ink); text-decoration: none; overflow-wrap: anywhere; }
.ttl.blank { font-weight: 500; color: var(--muted); }
.host { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; }
.note { margin: 0; font-size: 14px; overflow-wrap: anywhere; white-space: pre-wrap; }
.acts { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 6px 8px; align-items: center; padding-top: 8px; border-top: 1px solid var(--line); }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.seg button { background: transparent; color: var(--muted); border: 0; border-right: 1px solid var(--line); padding: 4px 12px; min-height: 38px; font-size: 13px; }
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { font-weight: 700; }
.seg button[data-st="want"][aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
.seg button[data-st="done"][aria-pressed="true"] { background: var(--done); color: var(--surface); }
.seg button[data-st="hold"][aria-pressed="true"] { background: var(--hold); color: var(--surface); }
.open { background: var(--accent-soft); color: var(--accent); border-radius: 10px; padding: 0 14px; min-height: 38px; display: inline-flex; align-items: center; font-weight: 700; font-size: 13px; text-decoration: none; }
.link { background: transparent; border: 0; color: var(--muted); padding: 4px 8px; min-height: 38px; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; }
.link.danger { color: var(--danger); }
.spacer { flex: 1; }
.is-done .ttl { color: var(--muted); }
.edit { grid-column: 2; display: grid; gap: 8px; min-width: 0; }
.empty { border: 2px dashed var(--line); border-radius: 14px; padding: 30px 18px; text-align: center; color: var(--muted); list-style: none; background: var(--surface); }
.empty b { display: block; color: var(--ink); font-size: 16px; margin-bottom: 6px; }
.foot { font-size: 12px; color: var(--muted); text-align: center; margin: 0; }
@media (prefers-reduced-motion: no-preference) { .item { transition: box-shadow .2s, border-color .2s; } }
</style>

<header>
  <div class="in">
    <div>
      <h1>まんがメモ</h1>
      <p class="sub">気になった漫画のリンクを、見つけたその場で貼っておく。</p>
    </div>
    <div class="count" aria-live="polite"><b id="nWant">0</b>冊 読みたい</div>
  </div>
</header>

<main class="wrap">
  <section aria-labelledby="addH">
    <h2 id="addH"><span class="mk" aria-hidden="true">＋</span>リンクを追加</h2>
    <form class="card" id="addForm" autocomplete="off">
      <div class="field">
        <label for="url">XやYouTubeのリンクを貼る</label>
        <div class="urlrow">
          <input type="text" id="url" inputmode="url" placeholder="https://…" enterkeyhint="done">
          <button class="primary" id="addBtn" type="submit" disabled>追加</button>
        </div>
      </div>
      <details id="more">
        <summary>タイトル・メモ・表紙も入れる(任意)</summary>
        <div class="more">
          <div class="field">
            <label>表紙</label>
            <button class="cover empty-c" id="addCover" type="button" aria-label="表紙の画像を選ぶ"><span><span class="plus">＋</span>画像を選ぶ</span></button>
            <button class="link" id="addCoverClear" type="button" hidden>外す</button>
          </div>
          <div class="fields">
            <div class="field">
              <label for="title">タイトル</label>
              <input type="text" id="title" placeholder="例:漫画のタイトル">
            </div>
            <div class="field">
              <label for="note">メモ</label>
              <input type="text" id="note" placeholder="例:○○さんが紹介していた">
            </div>
          </div>
        </div>
      </details>
      <p class="msg" id="msg" role="status"></p>
    </form>
  </section>

  <section aria-labelledby="listH">
    <div class="listhead">
      <h2 id="listH"><span class="mk" aria-hidden="true">≡</span>リスト</h2>
      <button class="pick" id="pick" type="button">どれ読もう?</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <input type="text" id="q" placeholder="タイトル・メモ・リンクで検索" aria-label="検索">
    <ul class="list" id="list"></ul>
    <p class="foot" id="foot"></p>
  </section>
</main>

<input type="file" id="file" accept="image/*" hidden>

<script>
(function () {
  "use strict";
  var $ = function (s) { return document.querySelector(s); };
  var STATUS = { want: "読みたい", done: "読んだ", hold: "保留" };
  var LS_KEY = "manga-memo-v1";

  var items = [];
  var store = null;
  var ready = false;
  var filter = "want";
  var query = "";
  var editingId = null;
  var editCover; /* undefined = unchanged, "" = removed, data URL = new */
  var addCover = "";
  var fileTarget = null; /* "add" | "edit" | item id */
  var hlId = null;
  var delArmed = null;
  var delTimer = null;
  var mode = "loading";

  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function newId() { return "m" + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }
  function extractUrl(t) {
    var m = String(t || "").match(/https?:\/\/[^\s<>"'）」』]+/i);
    return m ? m[0] : null;
  }
  function hostOf(u) { try { return new URL(u).hostname.replace(/^www\.|^mobile\.|^m\./, ""); } catch (e) { return ""; } }
  function sourceOf(u) {
    var h = hostOf(u);
    if (h === "x.com" || h === "twitter.com") return "X";
    if (h === "youtube.com" || h === "youtu.be" || h === "music.youtube.com") return "YouTube";
    return h || "Web";
  }
  function normKey(u) {
    try {
      var x = new URL(u);
      ["utm_source", "utm_medium", "utm_campaign", "s", "t", "si", "feature"].forEach(function (k) { x.searchParams.delete(k); });
      return hostOf(u) + x.pathname.replace(/\/$/, "") + x.search;
    } catch (e) { return u; }
  }
  function shortLink(u) {
    try {
      var x = new URL(u);
      var s = hostOf(u) + x.pathname.replace(/\/$/, "");
      return s.length > 60 ? s.slice(0, 57) + "…" : s;
    } catch (e) { return u; }
  }
  function fmtDate(ms) { var d = new Date(ms); return (d.getMonth() + 1) + "/" + d.getDate(); }
  function say(text, isErr) {
    var el = $("#msg");
    el.textContent = text || "";
    el.className = "msg" + (isErr ? " err" : "");
  }

  /* ---------- cover images (resized in the browser, stored with the item) ---------- */
  function toCover(file) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(file);
      var img = new Image();
      img.onload = function () {
        var maxW = 240, maxH = 340;
        var s = Math.min(1, maxW / img.naturalWidth, maxH / img.naturalHeight);
        var w = Math.max(1, Math.round(img.naturalWidth * s));
        var h = Math.max(1, Math.round(img.naturalHeight * s));
        var c = document.createElement("canvas");
        c.width = w; c.height = h;
        var ctx = c.getContext("2d");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        URL.revokeObjectURL(url);
        resolve(c.toDataURL("image/jpeg", 0.8));
      };
      img.onerror = function () { URL.revokeObjectURL(url); reject(new Error("img")); };
      img.src = url;
    });
  }
  function applyCover(file) {
    if (!file || !/^image\//.test(file.type)) { say("画像ファイルを選んでください。", true); return; }
    toCover(file).then(function (data) {
      if (fileTarget === "add") { addCover = data; renderAddCover(); $("#more").open = true; }
      else if (fileTarget === "edit") { editCover = data; render(); }
      else if (fileTarget && store) { guard(store.update(fileTarget, { cover: data })); }
      say("");
    }).catch(function () { say("画像を読み込めませんでした。", true); });
  }
  function renderAddCover() {
    var b = $("#addCover");
    if (addCover) {
      b.className = "cover";
      b.innerHTML = '<img alt="" src="' + addCover + '">';
    } else {
      b.className = "cover empty-c";
      b.innerHTML = '<span><span class="plus">＋</span>画像を選ぶ</span>';
    }
    $("#addCoverClear").hidden = !addCover;
  }
  function pickFile(target) { fileTarget = target; var f = $("#file"); f.value = ""; f.click(); }
  $("#file").addEventListener("change", function (ev) { applyCover(ev.target.files && ev.target.files[0]); });
  $("#addCover").addEventListener("click", function () { pickFile("add"); });
  $("#addCoverClear").addEventListener("click", function () { addCover = ""; renderAddCover(); });
  document.addEventListener("paste", function (ev) {
    var files = ev.clipboardData && ev.clipboardData.files;
    if (!files || !files.length) return;
    var f = null;
    for (var i = 0; i < files.length; i++) { if (/^image\//.test(files[i].type)) { f = files[i]; break; } }
    if (!f) return;
    ev.preventDefault();
    fileTarget = editingId ? "edit" : "add";
    applyCover(f);
  });

  /* ---------- storage ---------- */
  function makeLocalStore() {
    function load() {
      try { var raw = localStorage.getItem(LS_KEY); var v = raw ? JSON.parse(raw) : []; return Array.isArray(v) ? v : []; }
      catch (e) { return []; }
    }
    function save() { try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch (e) { say("この端末の保存容量がいっぱいです。", true); } }
    return {
      mode: "local",
      start: function () { items = load(); ready = true; render(); },
      add: function (obj) { obj.id = newId(); items.unshift(obj); save(); render(); return Promise.resolve(); },
      update: function (id, patch) {
        items = items.map(function (it) { return it.id === id ? Object.assign({}, it, patch) : it; });
        save(); render(); return Promise.resolve();
      },
      remove: function (id) { items = items.filter(function (it) { return it.id !== id; }); save(); render(); return Promise.resolve(); }
    };
  }
  function makeDbStore(col) {
    return {
      mode: "db",
      start: function () {
        var timer = setTimeout(function () { if (!ready) say("読み込みに時間がかかっています。通信を確認してください。", true); }, 10000);
        col.onSnapshot(function (snap) {
          items = snap.docs.map(function (d) { var o = Object.assign({}, d.data()); o.id = d.id; return o; });
          if (!snap.metadata.fromCache || snap.size > 0) { ready = true; clearTimeout(timer); }
          render();
        }, function () { clearTimeout(timer); say("リストを読み込めませんでした。ページを開き直してください。", true); });
      },
      add: function (obj) { return col.doc(newId()).set(obj); },
      update: function (id, patch) { return col.doc(id).update(patch); },
      remove: function (id) { return col.doc(id).delete(); }
    };
  }

  async function boot() {
    render();
    var db = null, uid = null;
    try {
      if (window.claude && typeof window.claude.use === "function") {
        db = await window.claude.use("db");
        var user = await window.claude.use("user");
        uid = user ? await user.id() : null;
      }
    } catch (e) { db = null; }
    store = (db && uid) ? makeDbStore(db.collection("data/users/" + uid)) : makeLocalStore();
    mode = store.mode;
    store.start();
    $("#addBtn").disabled = false;
    render();
  }

  /* ---------- actions ---------- */
  function guard(p) {
    return Promise.resolve(p).catch(function (e) {
      var code = e && e.code;
      say(code === "quota_exceeded" ? "保存できる上限に達しました。いくつか削除してください。" : "保存できませんでした。もう一度試してください。", true);
    });
  }

  $("#addForm").addEventListener("submit", function (ev) {
    ev.preventDefault();
    if (!store) return;
    var raw = $("#url").value.trim();
    var url = extractUrl(raw);
    if (!url) { say("http から始まるリンクを貼ってください。", true); return; }
    var key = normKey(url);
    var dup = items.filter(function (it) { return normKey(it.url) === key; })[0];
    if (dup) { say("このリンクはすでにリストにあります。", true); hlId = dup.id; filter = "all"; render(); scrollToItem(dup.id); return; }
    var title = $("#title").value.trim();
    var note = $("#note").value.trim();
    if (!title) {
      var rest = raw.replace(url, "").trim();
      if (rest && rest.length <= 80) title = rest;
    }
    var obj = { url: url, title: title, note: note, status: "want", source: sourceOf(url), addedAt: Date.now() };
    if (addCover) obj.cover = addCover;
    $("#addBtn").disabled = true;
    guard(store.add(obj)).then(function () {
      $("#url").value = ""; $("#title").value = ""; $("#note").value = "";
      addCover = ""; renderAddCover(); $("#more").open = false;
      say("追加しました。");
      if (filter === "done" || filter === "hold") filter = "want";
      render();
    }).then(function () { $("#addBtn").disabled = false; });
  });

  $("#tabs").addEventListener("click", function (ev) {
    var b = ev.target.closest("button[data-f]");
    if (!b) return;
    filter = b.dataset.f; hlId = null; render();
  });
  $("#q").addEventListener("input", function (ev) { query = ev.target.value.trim().toLowerCase(); hlId = null; render(); });

  $("#pick").addEventListener("click", function () {
    var pool = items.filter(function (it) { return it.status === "want"; });
    if (!pool.length) { say("「読みたい」のリストが空です。", true); return; }
    var it = pool[Math.floor(Math.random() * pool.length)];
    hlId = it.id; filter = "want"; query = ""; $("#q").value = "";
    say("");
    render(); scrollToItem(it.id);
  });

  function scrollToItem(id) {
    var el = document.querySelector('[data-id="' + id + '"]');
    if (el && el.scrollIntoView) el.scrollIntoView({ block: "center", behavior: "smooth" });
  }

  $("#list").addEventListener("click", function (ev) {
    var li = ev.target.closest("li[data-id]");
    if (!li) return;
    var id = li.dataset.id;
    var b = ev.target.closest("button");
    if (!b) return;
    if (b.dataset.st) {
      var patch = { status: b.dataset.st };
      patch.doneAt = b.dataset.st === "done" ? Date.now() : null;
      guard(store.update(id, patch));
    } else if (b.dataset.act === "cover") {
      pickFile(id);
    } else if (b.dataset.act === "editcover") {
      pickFile("edit");
    } else if (b.dataset.act === "uncover") {
      editCover = ""; render();
    } else if (b.dataset.act === "edit") {
      editingId = id; editCover = undefined; render();
    } else if (b.dataset.act === "cancel") {
      editingId = null; editCover = undefined; render();
    } else if (b.dataset.act === "save") {
      var t = li.querySelector(".e-title").value.trim();
      var n = li.querySelector(".e-note").value.trim();
      var p = { title: t, note: n };
      if (editCover !== undefined) p.cover = editCover;
      editingId = null; editCover = undefined;
      guard(store.update(id, p)).then(function () { render(); });
    } else if (b.dataset.act === "del") {
      if (delArmed === id) {
        delArmed = null; clearTimeout(delTimer);
        guard(store.remove(id));
      } else {
        delArmed = id; render();
        clearTimeout(delTimer);
        delTimer = setTimeout(function () { delArmed = null; render(); }, 3500);
      }
    }
  });

  /* ---------- render ---------- */
  function counts() {
    var c = { all: items.length, want: 0, done: 0, hold: 0 };
    items.forEach(function (it) { if (c[it.status] != null) c[it.status]++; });
    return c;
  }
  function coverHtml(src, act) {
    if (src) return '<button class="cover" type="button" data-act="' + act + '" aria-label="表紙を変更"><img alt="" src="' + esc(src) + '"></button>';
    return '<button class="cover empty-c" type="button" data-act="' + act + '" aria-label="表紙を追加"><span><span class="plus">＋</span>表紙</span></button>';
  }
  function itemHtml(it) {
    var st = STATUS[it.status] ? it.status : "want";
    var srcLabel = it.source || sourceOf(it.url);
    var label = it.title ? esc(it.title) : esc(srcLabel === "X" ? "Xの投稿" : srcLabel === "YouTube" ? "YouTubeの動画" : srcLabel) + "のリンク";
    if (editingId === it.id) {
      var cur = editCover !== undefined ? editCover : it.cover;
      return '<li class="item" data-id="' + esc(it.id) + '">' +
        '<div>' + coverHtml(cur, "editcover") + (cur ? '<button class="link" data-act="uncover" type="button">表紙を外す</button>' : "") + "</div>" +
        '<div class="edit">' +
        '<div class="field"><label>タイトル</label><input type="text" class="e-title" value="' + esc(it.title) + '"></div>' +
        '<div class="field"><label>メモ</label><input type="text" class="e-note" value="' + esc(it.note) + '"></div>' +
        '<div class="acts" style="border:0;padding:0"><button class="primary" data-act="save" type="button">保存</button>' +
        '<button class="link" data-act="cancel" type="button">やめる</button></div></div></li>';
    }
    var seg = ["want", "done", "hold"].map(function (k) {
      return '<button type="button" data-st="' + k + '" aria-pressed="' + (k === st) + '">' + STATUS[k] + "</button>";
    }).join("");
    var armed = delArmed === it.id;
    return '<li class="item is-' + st + (hlId === it.id ? " hl" : "") + '" data-id="' + esc(it.id) + '">' +
      coverHtml(it.cover, "cover") +
      '<div class="body"><div class="top"><span class="pill ' + st + '">' + STATUS[st] + '</span><span class="src">' + esc(srcLabel) + "</span><span>" + esc(fmtDate(it.addedAt || Date.now())) + " 追加</span></div>" +
      '<a class="ttl' + (it.title ? "" : " blank") + '" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">' + label + "</a>" +
      '<div class="host">' + esc(shortLink(it.url)) + "</div>" +
      (it.note ? '<p class="note">' + esc(it.note) + "</p>" : "") + "</div>" +
      '<div class="acts"><div class="seg" role="group" aria-label="状態">' + seg + "</div>" +
      '<a class="open" href="' + esc(it.url) + '" target="_blank" rel="noopener noreferrer">開く ↗</a>' +
      '<span class="spacer"></span>' +
      '<button class="link" data-act="edit" type="button">編集</button>' +
      '<button class="link danger" data-act="del" type="button">' + (armed ? "本当に削除する" : "削除") + "</button></div></li>";
  }
  function render() {
    var c = counts();
    $("#nWant").textContent = c.want;
    var defs = [["want", "読みたい"], ["done", "読んだ"], ["hold", "保留"], ["all", "すべて"]];
    $("#tabs").innerHTML = defs.map(function (d) {
      return '<button class="tab" type="button" data-f="' + d[0] + '" aria-pressed="' + (filter === d[0]) + '"><b>' + c[d[0]] + "</b>" + d[1] + "</button>";
    }).join("");

    var list = $("#list");
    if (!ready) { list.innerHTML = '<li class="empty">読み込み中…</li>'; $("#foot").textContent = ""; return; }

    var shown = items.filter(function (it) {
      if (filter !== "all" && it.status !== filter) return false;
      if (!query) return true;
      return ((it.title || "") + " " + (it.note || "") + " " + (it.url || "") + " " + (it.source || "")).toLowerCase().indexOf(query) !== -1;
    }).sort(function (a, b) { return (b.addedAt || 0) - (a.addedAt || 0); });

    if (!shown.length) {
      var msg;
      if (!items.length) msg = '<b>まだ何も入っていません</b>気になる漫画を見つけたら、リンクをコピーして上の欄に貼るだけ。タイトルや表紙は後から足せます。';
      else if (query) msg = "<b>見つかりませんでした</b>検索語を変えてみてください。";
      else msg = "<b>ここは空です</b>ほかのタブを選ぶと、別の漫画が見られます。";
      list.innerHTML = '<li class="empty">' + msg + "</li>";
    } else {
      list.innerHTML = shown.map(itemHtml).join("");
    }
    $("#foot").textContent = mode === "local" ? "この端末のブラウザにだけ保存されています。" : "";
  }

  boot();
})();
</script>

</body></html>
